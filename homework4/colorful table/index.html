<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>colorful table</title>
    <style>
      table {
        border-collapse: collapse;
        width: 300px;
      }

      td {
        border: 2px solid black;
        height: 35px;
      }

      .yellow {
        background-color: rgb(244, 214, 80);
      }
      .blue {
        background-color: rgb(103, 224, 228);
      }
      .orange {
        background-color: orange;
      }
      .green {
        background-color: rgb(11, 142, 11);
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="yellow" colspan="3" rowspan="6"></td>
        <td class="blue" colspan="3" rowspan="7"></td>
        <td class="yellow" rowspan="6"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="green"></td>
      </tr>
      <tr>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="blue" colspan="2" rowspan="4"></td>
        <td class="blue"></td>
        <td class="yellow" rowspan="4"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="blue" colspan="3" rowspan="3"></td>
        <td class="yellow"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="yellow"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="orange"></td>
        <td class="green"></td>
      </tr>
      <tr>
        <td class="blue" colspan="4" rowspan="2"></td>
        <td class="yellow" rowspan="2"></td>
        <td class="yellow" colspan="2" rowspan="3"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="green"></td>
      </tr>
      <tr>
        <td class="blue" colspan="4" rowspan="3"></td>
        <td class="orange" rowspan="4"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="yellow" rowspan="3"></td>
        <td class="orange"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="orange" rowspan="2"></td>
        <td class="orange"></td>
      </tr>
      <tr>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="blue"></td>
        <td class="orange"></td>
      </tr>
    </table>
  </body>
</html>
