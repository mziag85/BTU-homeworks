<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma homework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <div class="name_block">
          <div class="circle"></div>
          <ul>
            <li class="name">Your Name</li>
            <li class="username">@username</li>
          </ul>

          <span class="vector">
            <img src="./checkedSign.svg" alt="checked sign" />
          </span>
        </div>
        <div class="subscribe_box">
          <span class="subscribe">Subscribe</span>
          <span class="dots"> <b>...</b></span>
        </div>
      </div>
      <main>
        <p class="main_text">
          This is an example post. Blah blah blah. I know it’s not the best
          template in the world, but at least it’s free. Have fun using this for
          your project.
        </p>
        <p class="hashtag" style="color: #30b3f0">#hashtag</p>

        <div class="rectangle"></div>
      </main>

      <aside class="time_date">
        <span class="time">12:00 PM</span>
        <span class="dot"><b>.</b></span>
        <span class="date">Oct 14, 2023</span>
        <span class="dot"><b>.</b></span>
        <span class="viewers">200.1K Views</span>
      </aside>

      <footer class="footer">
        <span class="comments">
          <img src="./commentsign.svg" alt="comment sign" />991</span
        >

        <span class="arrows">
          <img src="./leftArrow.svg" alt="arrow sign" />
          <img src="./rightArrow.svg" alt="arrow sign" />
          1,581
        </span>

        <span class="reactions">
          <img src="./heart.svg" alt="heart sign" />9,867
        </span>

        <span class="flag"> <img src="./flag.svg" alt="flag sign" /> 90</span>

        <span class="upload"><img src="./upload.svg" alt="" /></span>
      </footer>
    </div>
  </body>
</html>
